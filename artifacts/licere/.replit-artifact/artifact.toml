kind = "web"
previewPath = "/"
title = "Licere"
description = "Plataforma de gestão ambiental, EHS e Compliance para acompanhar licenças, condicionantes e documentos de Centros de Distribuição. Inclui visão executiva, gráfico de vencimentos, busca e acompanhamento de status."
version = "1.0.0"
id = "artifacts/licere"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24887

[services.development]
run = "pnpm --filter @workspace/licere run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/licere", "run", "build" ]
serve = "static"
publicDir = "artifacts/licere/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24887"
BASE_PATH = "/"
